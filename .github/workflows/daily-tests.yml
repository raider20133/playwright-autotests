name: Autotests

on:
  schedule:
    - cron: "0 1 * * *"
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# QA users are keyed by project + worker slot, so two runs at once would share users
concurrency:
  group: autotests
  cancel-in-progress: false

env:
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  REGISTRATION_CODE: ${{ secrets.REGISTRATION_CODE || secrets.SECRET_PASSWORD }}

jobs:
  quality:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  tests:
    name: Tests (${{ matrix.project }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        if: matrix.project != 'api'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
      - name: Install ${{ matrix.project }}
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}

      # No "|| true": a failing test fails the job. Reporting steps below still run.
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          retention-days: 3
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  report:
    name: Report & notify
    needs: tests
    if: always() && needs.tests.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      REPORT_URL: https://raider20133.github.io/playwright-autotests/${{ github.run_id }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Carry the trend graphs over from the previous published report
      - name: Restore Allure history
        continue-on-error: true
        run: |
          git fetch --depth=1 origin gh-pages
          git archive origin/gh-pages latest/history | tar -x
          mv latest/history allure-results/history

      - run: npm run allure:generate

      - name: Job summary
        run: node scripts/report-summary.mjs allure-results github >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Allure report
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          date +%s > allure-report/deploy_timestamp.txt
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          npx gh-pages -d allure-report -b gh-pages -e ${{ github.run_id }} -r "$REPO"
          npx gh-pages -d allure-report -b gh-pages -e latest -r "$REPO"

      - name: Notify Telegram
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_TOKEN" ] && { echo "Telegram not configured"; exit 0; }
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$(node scripts/report-summary.mjs allure-results telegram)" \
            -d parse_mode=Markdown -d disable_web_page_preview=true

  cleanup_old_reports:
    name: Remove reports older than 30 days
    needs: report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GH_PAT }}
      - run: |
          git config --global user.name "GitHub Actions Cleanup"
          git config --global user.email "actions@github.com"
          CUTOFF=$(( $(date +%s) - 30 * 24 * 3600 ))
          for dir in $(ls -d [0-9]*/ 2>/dev/null | tr -d /); do
            ts_file="$dir/deploy_timestamp.txt"
            if [ -f "$ts_file" ] && [ "$(cat "$ts_file")" -lt "$CUTOFF" ]; then
              echo "Deleting $dir"; git rm -rq "$dir"
            fi
          done
          git diff --staged --quiet || { git commit -m "Remove Allure reports older than 30 days"; git push; }
